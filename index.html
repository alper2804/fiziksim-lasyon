<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Fizik Hata & Yoğunluk Simülasyonu</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #0b0e14;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* Sol Kontrol Paneli */
        #ui-panel {
            position: absolute;
            top: 15px; left: 15px;
            background: rgba(15, 20, 30, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 12px;
            width: 300px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 100;
        }
        
        /* Şık Scrollbar */
        #ui-panel::-webkit-scrollbar { width: 6px; }
        #ui-panel::-webkit-scrollbar-thumb { background: rgba(0, 234, 141, 0.5); border-radius: 3px; }
        
        h2 {
            margin-top: 0; font-size: 1.1rem; color: #00ea8d;
            border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 15px;
        }
        h3 { font-size: 0.9rem; color: #aaa; margin: 15px 0 5px 0; border-bottom: 1px dashed #333; padding-bottom: 3px; }
        
        .input-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .input-group label { font-size: 0.85rem; color: #ccc; }
        .input-group input, .input-group select {
            width: 100px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2);
            color: #00ea8d; padding: 4px 8px; border-radius: 4px; outline: none; font-weight: bold;
        }
        .input-group input[type="text"] { color: #fff; }
        
        /* Sonuç Kartı */
        #result-box {
            margin-top: 15px; padding: 12px;
            background: rgba(0, 234, 141, 0.1);
            border: 1px solid rgba(0, 234, 141, 0.3);
            border-radius: 8px;
        }
        .result-row { margin-bottom: 5px; font-size: 0.85rem; }
        .result-highlight { font-size: 1rem; color: #00ea8d; font-weight: bold; margin-top: 8px; display: block; }
        
        /* 3D Üzerindeki Dinamik Yazılar (Ölçü Çizgisi Etiketleri) */
        #labels-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50;
        }
        .dim-label {
            position: absolute;
            background: rgba(15, 20, 30, 0.8);
            border: 1px solid #00ea8d;
            color: #00ea8d;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            font-family: monospace;
            transform: translate(-50%, -50%); /* Ortalamak için */
            text-shadow: 1px 1px 2px black;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>
    
    <div id="ui-panel">
        <h2>Fizik Hata Laboratuvarı</h2>
        
        <div class="input-group">
            <label>Şekil:</label>
            <select id="shape-type" onchange="updateUI()">
                <option value="cylinder">Silindir</option>
                <option value="prism">Dikdörtgen Prizma</option>
                <option value="sphere">Küre</option>
            </select>
        </div>

        <h3>Birim Sistemi</h3>
        <div class="input-group">
            <label>Uzunluk Birimi:</label>
            <input type="text" id="unit-len" value="cm" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Kütle Birimi:</label>
            <input type="text" id="unit-mass" value="g" oninput="calculate()">
        </div>
        
        <h3>Cihaz Hataları (Mutlak)</h3>
        <div class="input-group">
            <label>Tartı (&Delta;m):</label>
            <input type="number" id="delta-m" value="0.01" step="0.01" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Kumpas (&Delta;x):</label>
            <input type="number" id="delta-x" value="0.005" step="0.001" oninput="calculate()">
        </div>
        
        <h3>Ölçümler</h3>
        <div class="input-group">
            <label>Kütle (m):</label>
            <input type="number" id="val-m" value="150" oninput="calculate()">
        </div>
        
        <!-- Dinamik Ölçüm Girdileri -->
        <div id="dynamic-inputs"></div>
        
        <!-- Sonuç Ekranı -->
        <div id="result-box">
            <div class="result-row">Hacim (V): <span id="res-v">0</span></div>
            <div class="result-row">Yoğunluk (&rho;): <span id="res-rho">0</span></div>
            <div class="result-row">Bağıl Hata: <span id="res-bagil">0</span>%</div>
            <span class="result-highlight" id="res-final">&rho; = 0.000 &plusmn; 0.000</span>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- 1. THREE.JS KURULUMU ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 15, 25);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // Işıklar ve Ortam
        scene.add(new THREE.AmbientLight(0x404040, 2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        scene.add(new THREE.GridHelper(50, 50, 0x444444, 0x222222)); // Zemin Izgarası

        // Nesne Tutucular
        let currentMesh = null;
        let lineGroup = new THREE.Group();
        scene.add(lineGroup);
        
        // Etiket Tutucu Dizi
        let activeLabels = [];
        const labelsContainer = document.getElementById
